<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" fill="none" role="img" aria-labelledby="title desc"><title id="title">DarkTower — I build for the web. And keep it running.</title><desc id="desc">Cristian Arrieta. Frontend and platform engineering.</desc><style>
.tower-outline{stroke-dasharray:180 820;animation:trace 6s linear infinite}
.signal-trace{stroke-dasharray:9 91;animation:orbit 5s linear infinite}
.beacon{animation:breathe 4s ease-in-out infinite}
.windows{animation:windows 5s ease-in-out infinite}
.orbit-echo{stroke-dasharray:3 7;animation:orbit 15s linear infinite reverse}
@keyframes trace{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes orbit{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes breathe{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes windows{0%,100%{stroke-opacity:.25}50%{stroke-opacity:.8}}
@media(prefers-reduced-motion:reduce){.tower-outline,.signal-trace,.beacon,.windows,.orbit-echo{animation:none}.tower-outline{stroke-dasharray:none;stroke-opacity:.5}}
</style><rect width="640" height="460" rx="16" fill="#f6f4f2"/><rect x="1" y="1" width="638" height="458" rx="15" stroke="#d7cfd6"/>
