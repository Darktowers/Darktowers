<text x="36" y="58" font-family="Consolas,monospace" font-size="23" font-weight="700" fill="#e11d48">DarkTower<tspan fill="#6b6470">_dev</tspan></text>
<text x="36" y="97" font-family="Consolas,monospace" font-size="15" fill="#6b6470">FRONTEND + PLATFORM</text>
<g transform="translate(500 102) scale(.54) translate(-1030 -231)"><ellipse class="orbit-echo" pathLength="100" cx="1030" cy="231" rx="155" ry="44" transform="rotate(-30 1030 231)" stroke="#e11d48" stroke-opacity=".45"/><path d="M965 311V139L1030 96L1095 139V311L1030 345Z" fill="#ece8e4" stroke="#e11d48" stroke-width="2"/><path class="tower-outline" pathLength="1000" d="M965 311V139L1030 96L1095 139V311L1030 345Z" fill="none" stroke="#e11d48" stroke-width="3"/><path class="windows" d="M965 139L1030 175L1095 139M1030 175V345" stroke="#e11d48"/><ellipse class="signal-trace" pathLength="100" cx="1030" cy="231" rx="155" ry="44" transform="rotate(-30 1030 231)" stroke="#e11d48" stroke-width="4"/></g>
