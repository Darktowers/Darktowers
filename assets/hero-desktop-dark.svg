<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">DarkTower — Interfaces with intent. Systems with backbone.</title>
  <desc id="desc">Rose-colored transmission lines orbit an architectural tower on a charcoal grid. React, TypeScript, and AWS.</desc>
  <style>
.tower-outline{stroke-dasharray:1000;animation:build 2.4s ease-out 1}
.signal-trace{stroke-dasharray:32 642;animation:transmit 9s linear infinite}
.beacon{animation:breathe 6s ease-in-out infinite}
.windows{animation:windows 7s ease-in-out infinite}
.orbit-echo{stroke-dasharray:5 12;animation:echo 24s linear infinite}
@keyframes build{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes transmit{from{stroke-dashoffset:674}to{stroke-dashoffset:0}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes windows{0%,100%{stroke-opacity:.18}50%{stroke-opacity:.65}}
@keyframes echo{to{stroke-dashoffset:-340}}
@media(prefers-reduced-motion:reduce){.tower-outline,.signal-trace,.beacon,.windows,.orbit-echo{animation:none}}
</style><defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#1b1e27" stroke-width="1"/></pattern>
    <radialGradient id="signal"><stop stop-color="#fb4d6a" stop-opacity=".13"/><stop offset="1" stop-color="#fb4d6a" stop-opacity="0"/></radialGradient>
    <linearGradient id="face" x1="950" y1="90" x2="1115" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#27232e"/><stop offset="1" stop-color="#0e1015"/></linearGradient>
  </defs>
  <rect width="1280" height="420" rx="16" fill="#08090c"/>
  <rect x="1" y="1" width="1278" height="418" rx="15" stroke="#29242f"/>
  <path d="M800 1H1264Q1279 1 1279 16V404Q1279 419 1264 419H800Z" fill="url(#grid)"/>
  <ellipse class="beacon" cx="1040" cy="210" rx="240" ry="210" fill="url(#signal)"/>
  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace">
    <text x="56" y="62" font-size="19" font-weight="700" fill="#fb4d6a">DarkTower<tspan fill="#8b909c">_dev</tspan></text>
    <text x="56" y="98" font-size="11" letter-spacing="3" fill="#8b909c">FRONTEND / PLATFORM ENGINEERING</text>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="700" letter-spacing="-2">
    <text x="52" y="188" fill="#e7e9ee">Interfaces with intent.</text>
    <text x="52" y="254" fill="#fb4d6a">Systems with backbone.</text>
  </g>
  <path d="M56 298H735" stroke="#2b2731"/>
  <text x="56" y="340" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#e7e9ee">Cristian Arrieta</text>
  <text x="56" y="370" font-family="'SFMono-Regular',Consolas,monospace" font-size="12" letter-spacing="1" fill="#8b909c">BOGOTÁ, CO  /  REACT · TYPESCRIPT · AWS</text>
  <g stroke="#fb4d6a">
    <ellipse class="orbit-echo" cx="1030" cy="231" rx="181" ry="61" transform="rotate(-30 1030 231)" stroke-opacity=".24"/>
    <ellipse cx="1030" cy="231" rx="155" ry="44" transform="rotate(-30 1030 231)" stroke-opacity=".5"/>
    <path d="M1030 61V98M1030 335V366M834 231H866M1198 231H1230" stroke-opacity=".4"/>
  </g>
  <path class="tower-outline" d="M965 311V139L1030 96L1095 139V311L1030 345Z" fill="url(#face)" stroke="#79515e"/>
  <path d="M965 139L1030 175L1095 139M1030 175V345" stroke="#fb4d6a" stroke-opacity=".7"/>
  <path class="windows" d="M983 167V291M998 176V300M1013 184V309M1049 184V309M1064 176V300M1079 167V291" stroke="#fb4d6a" stroke-opacity=".22"/>
  <path d="M1004 135L1030 117L1056 135L1030 151Z" fill="#fb4d6a" fill-opacity=".12" stroke="#fb4d6a"/>
  <path d="M862 270C870 290 915 290 969 274M1096 208C1158 177 1188 144 1178 128" stroke="#fb4d6a" stroke-width="2"/>
  <ellipse class="signal-trace" cx="1030" cy="231" rx="155" ry="44" transform="rotate(-30 1030 231)" stroke="#fb4d6a" stroke-width="3"/><circle class="beacon" cx="886" cy="282" r="5" fill="#fb4d6a"/>
  <circle cx="1169" cy="157" r="4" fill="#e7e9ee"/>
  <g font-family="'SFMono-Regular',Consolas,monospace" font-size="10" letter-spacing="2" fill="#8b909c">
    <text x="904" y="389">FROM INTERFACE TO INFRA</text>
  </g>
</svg>
