<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Interfaces: React and Next.js. Services: Node.js and GraphQL. Infrastructure: AWS and SST."><style>
.active-card{animation:handoff 9s ease-in-out infinite}
.phase-1{animation-delay:-6s}.phase-2{animation-delay:-3s}
.packet{stroke-dasharray:4 24;animation:packet 3s linear infinite}
.scanner{stroke-dasharray:12 120;animation:scan 5s ease-in-out infinite}
@keyframes handoff{0%,34%,100%{stroke-opacity:0}8%,25%{stroke-opacity:.85}}
@keyframes packet{to{stroke-dashoffset:-28}}
@keyframes scan{0%,100%{stroke-dashoffset:132;opacity:.25}50%{stroke-dashoffset:0;opacity:.85}}
@media(prefers-reduced-motion:reduce){.active-card,.packet,.scanner{animation:none}.active-card{stroke-opacity:.3}.scanner{stroke-dasharray:none;opacity:.35}}
