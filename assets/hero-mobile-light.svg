<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" fill="none" role="img" aria-labelledby="title desc"><title id="title">DarkTower — Interfaces with intent. Systems with backbone.</title><desc id="desc">Cristian Arrieta. Frontend and platform engineering.</desc><style>
.tower-outline{stroke-dasharray:1000;animation:build 2.4s ease-out 1}
.signal-trace{stroke-dasharray:32 642;animation:transmit 9s linear infinite}
.beacon{animation:breathe 6s ease-in-out infinite}
.windows{animation:windows 7s ease-in-out infinite}
.orbit-echo{stroke-dasharray:5 12;animation:echo 24s linear infinite}
@keyframes build{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes transmit{from{stroke-dashoffset:674}to{stroke-dashoffset:0}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.9}}
@keyframes windows{0%,100%{stroke-opacity:.18}50%{stroke-opacity:.65}}
@keyframes echo{to{stroke-dashoffset:-340}}
@media(prefers-reduced-motion:reduce){.tower-outline,.signal-trace,.beacon,.windows,.orbit-echo{animation:none}}
</style><rect width="640" height="460" rx="16" fill="#f6f4f2"/><rect x="1" y="1" width="638" height="458" rx="15" stroke="#d7cfd6"/>
<g stroke="#e7e0e4"><path d="M400 0V460M440 0V460M480 0V460M520 0V460M560 0V460M600 0V460M400 40H640M400 80H640M400 120H640M400 160H640M400 200H640"/><circle class="beacon" cx="500" cy="31" r="3" fill="#e11d48"/></g>
<text x="36" y="58" font-family="Consolas,monospace" font-size="23" font-weight="700" fill="#e11d48">DarkTower<tspan fill="#6b6470">_dev</tspan></text>
<text x="36" y="97" font-family="Consolas,monospace" font-size="15" fill="#6b6470">FRONTEND + PLATFORM</text>
<g transform="translate(500 102) scale(.54) translate(-1030 -231)"><ellipse class="orbit-echo" cx="1030" cy="231" rx="155" ry="44" transform="rotate(-30 1030 231)" stroke="#e11d48" stroke-opacity=".45"/><path class="tower-outline" d="M965 311V139L1030 96L1095 139V311L1030 345Z" fill="#ece8e4" stroke="#e11d48" stroke-width="2"/><path class="windows" d="M965 139L1030 175L1095 139M1030 175V345" stroke="#e11d48"/><ellipse class="signal-trace" cx="1030" cy="231" rx="155" ry="44" transform="rotate(-30 1030 231)" stroke="#e11d48" stroke-width="4"/></g>
<g font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="700" letter-spacing="-1.8"><text x="34" y="227" fill="#16121a">Interfaces with intent.</text><text x="34" y="286" fill="#e11d48">Systems with backbone.</text></g>
